services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: joblens-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-joblens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-joblens}
      POSTGRES_DB: ${POSTGRES_DB:-joblens}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
